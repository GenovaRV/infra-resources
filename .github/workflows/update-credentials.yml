name: AWS Credentials Management

on:
  schedule:
    - cron: '0 */6 * * *' # Ejecutar cada 6 horas
  workflow_dispatch: # Permitir ejecución manual

jobs:
  get-aws-credentials:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Configurar AWS CLI con Credenciales Iniciales
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      run: |
        mkdir -p ~/.aws
        echo "[default]" > ~/.aws/credentials
        echo "aws_access_key_id = $AWS_ACCESS_KEY_ID" >> ~/.aws/credentials
        echo "aws_secret_access_key = $AWS_SECRET_ACCESS_KEY" >> ~/.aws/credentials
        echo "[default]" > ~/.aws/config
        echo "region = eu-west-3" >> ~/.aws/config

    - name: Obtener Credenciales Temporales
      id: get-session-token
      run: |
        CREDS=$(aws sts get-session-token --duration-seconds 3600 --query 'Credentials' --output json)
        echo "AWS_ACCESS_KEY_ID=$(echo $CREDS | jq -r '.AccessKeyId')" >> $GITHUB_ENV
        echo "AWS_SECRET_ACCESS_KEY=$(echo $CREDS | jq -r '.SecretAccessKey')" >> $GITHUB_ENV
        echo "AWS_SESSION_TOKEN=$(echo $CREDS | jq -r '.SessionToken')" >> $GITHUB_ENV

    - name: Configurar AWS CLI con Credenciales Temporales
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ env.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ env.AWS_SECRET_ACCESS_KEY }}
        aws-session-token: ${{ env.AWS_SESSION_TOKEN }}
        aws-region: eu-west-3

    - name: Guardar Credenciales en Secretos de GitHub
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        GITHUB_PUBLIC_KEY=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
                               -H "Accept: application/vnd.github.v3+json" \
                               https://api.github.com/repos/${{ github.repository }}/actions/secrets/public-key)

        ENCRYPTED_ACCESS_KEY_ID=$(echo -n "${{ env.AWS_ACCESS_KEY_ID }}" | openssl rsautl -encrypt -pubin -inkey <(echo $GITHUB_PUBLIC_KEY | jq -r '.key') | base64)
        ENCRYPTED_SECRET_ACCESS_KEY=$(echo -n "${{ env.AWS_SECRET_ACCESS_KEY }}" | openssl rsautl -encrypt -pubin -inkey <(echo $GITHUB_PUBLIC_KEY | jq -r '.key') | base64)
        ENCRYPTED_SESSION_TOKEN=$(echo -n "${{ env.AWS_SESSION_TOKEN }}" | openssl rsautl -encrypt -pubin -inkey <(echo $GITHUB_PUBLIC_KEY | jq -r '.key') | base64)

        curl -X PUT -H "Authorization: token $GITHUB_TOKEN" \
             -H "Accept: application/vnd.github.v3+json" \
             -d "{\"encrypted_value\":\"${ENCRYPTED_ACCESS_KEY_ID}\",\"key_id\":\"$(echo $GITHUB_PUBLIC_KEY | jq -r '.key_id')\"}" \
             https://api.github.com/repos/${{ github.repository }}/actions/secrets/AWS_ACCESS_KEY_ID

        curl -X PUT -H "Authorization: token $GITHUB_TOKEN" \
             -H "Accept: application/vnd.github.v3+json" \
             -d "{\"encrypted_value\":\"${ENCRYPTED_SECRET_ACCESS_KEY}\",\"key_id\":\"$(echo $GITHUB_PUBLIC_KEY | jq -r '.key_id')\"}" \
             https://api.github.com/repos/${{ github.repository }}/actions/secrets/AWS_SECRET_ACCESS_KEY

        curl -X PUT -H "Authorization: token $GITHUB_TOKEN" \
             -H "Accept: application/vnd.github.v3+json" \
             -d "{\"encrypted_value\":\"${ENCRYPTED_SESSION_TOKEN}\",\"key_id\":\"$(echo $GITHUB_PUBLIC_KEY | jq -r '.key_id')\"}" \
             https://api.github.com/repos/${{ github.repository }}/actions/secrets/AWS_SESSION_TOKEN
