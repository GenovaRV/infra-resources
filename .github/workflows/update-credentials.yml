name: AWS SSO Automation and Save Credentials

on:
  schedule:
    - cron: '0 */6 * * *' # Ejecutar cada 6 horas
  workflow_dispatch: # Permitir ejecución manual

  push:
    branches:
      - develop

jobs:
  automate-sso:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Configurar Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.9'

    - name: Instalar dependencias
      run: |
        sudo apt-get update
        sudo apt-get install -y unzip wget
        wget https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
        sudo dpkg -i google-chrome-stable_current_amd64.deb || sudo apt-get -f install -y
        wget -N https://chromedriver.storage.googleapis.com/96.0.4664.45/chromedriver_linux64.zip
        unzip chromedriver_linux64.zip
        sudo mv chromedriver /usr/local/bin/chromedriver
        sudo chown root:root /usr/local/bin/chromedriver
        python -m pip install --upgrade pip
        pip install selenium

    - name: Automatizar AWS SSO con Selenium
      env:
        AWS_SSO_START_URL: ${{ secrets.AWS_SSO_START_URL }}
        AWS_SSO_USERNAME: ${{ secrets.AWS_SSO_USERNAME }}
        AWS_SSO_PASSWORD: ${{ secrets.AWS_SSO_PASSWORD }}
        AWS_SSO_REGION: ${{ secrets.AWS_SSO_REGION }}
        AWS_SSO_ACCOUNT_ID: ${{ secrets.AWS_SSO_ACCOUNT_ID }}
        AWS_SSO_ROLE_NAME: ${{ secrets.AWS_SSO_ROLE_NAME }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        echo "
        from selenium import webdriver
        from selenium.webdriver.common.by import By
        from selenium.webdriver.common.keys import Keys
        from selenium.webdriver.support.ui import WebDriverWait
        from selenium.webdriver.support import expected_conditions as EC

        options = webdriver.ChromeOptions()
        options.add_argument('--headless')
        options.add_argument('--no-sandbox')
        options.add_argument('--disable-dev-shm-usage')

        driver = webdriver.Chrome(options=options)
        driver.get('${{ env.AWS_SSO_START_URL }}')

        try:
            accept_button = WebDriverWait(driver, 10).until(
                EC.element_to_be_clickable((By.ID, 'accept-button'))
            )
            accept_button.click()

            login_form = WebDriverWait(driver, 10).until(
                EC.presence_of_element_located((By.ID, 'login-form'))
            )
            username_input = driver.find_element(By.ID, 'username')
            password_input = driver.find_element(By.ID, 'password')
            login_button = driver.find_element(By.ID, 'login-button')

            username_input.send_keys('${{ env.AWS_SSO_USERNAME }}')
            password_input.send_keys('${{ env.AWS_SSO_PASSWORD }}')
            login_button.click()

            success_message = WebDriverWait(driver, 10).until(
                EC.presence_of_element_located((By.ID, 'success-message'))
            )
            print('AWS SSO aceptado y autenticación completada')

            # Obtener credenciales temporales con AWS CLI
            import subprocess
            import json

            creds_cmd = [
                'aws', 'sts', 'assume-role',
                '--role-arn', f'arn:aws:iam::{AWS_SSO_ACCOUNT_ID}:role/{AWS_SSO_ROLE_NAME}',
                '--role-session-name', 'github-actions',
                '--query', 'Credentials',
                '--output', 'json'
            ]
            creds_output = subprocess.check_output(creds_cmd).decode('utf-8')
            creds = json.loads(creds_output)

            access_key_id = creds['AccessKeyId']
            secret_access_key = creds['SecretAccessKey']
            session_token = creds['SessionToken']

            # Guardar las credenciales en secretos de GitHub
            import base64
            import requests

            def encrypt_secret(secret, public_key):
                from cryptography.hazmat.primitives.asymmetric import rsa, padding
                from cryptography.hazmat.primitives import serialization, hashes

                public_key = public_key.encode('utf-8')
                public_key = serialization.load_pem_public_key(public_key)
                encrypted_secret = public_key.encrypt(
                    secret.encode('utf-8'),
                    padding.OAEP(
                        mgf=padding.MGF1(algorithm=hashes.SHA256()),
                        algorithm=hashes.SHA256(),
                        label=None
                    )
                )
                return base64.b64encode(encrypted_secret).decode('utf-8')

            github_public_key = requests.get(
                f'https://api.github.com/repos/{owner}/{repo}/actions/secrets/public-key',
                headers={'Authorization': f'token {github_token}'}
            ).json()

            public_key = github_public_key['key']
            key_id = github_public_key['key_id']

            secrets = {
                'AWS_ACCESS_KEY_ID': access_key_id,
                'AWS_SECRET_ACCESS_KEY': secret_access_key,
                'AWS_SESSION_TOKEN': session_token
            }

            for secret_name, secret_value in secrets.items():
                encrypted_value = encrypt_secret(secret_value, public_key)
                data = {
                    'encrypted_value': encrypted_value,
                    'key_id': key_id
                }
                response = requests.put(
                    f'https://api.github.com/repos/{owner}/{repo}/actions/secrets/{secret_name}',
                    headers={'Authorization': f'token {github_token}'},
                    json=data
                )
                print(f'Secret {secret_name} guardado: {response.status_code}')
        
        finally:
            driver.quit()
        " > automate_sso.py
        python automate_sso.py
