name: AWS Credentials Automation

on:
  schedule:
    - cron: '0 */6 * * *' # Ejecutar cada 6 horas
  workflow_dispatch: # Permitir ejecución manual
  push:
    branches:
      - develop

jobs:
  fetch-credentials:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Configurar Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.9'

    - name: Instalar dependencias
      run: |
        sudo apt-get update
        sudo apt-get install -y unzip wget curl python3-pip
        python3 -m pip install selenium requests cryptography jq

    - name: Crear script de Python
      run: |
        echo "import os" > fetch_credentials.py
        echo "import json" >> fetch_credentials.py
        echo "from selenium import webdriver" >> fetch_credentials.py
        echo "from selenium.webdriver.common.by import By" >> fetch_credentials.py
        echo "from selenium.webdriver.support.ui import WebDriverWait" >> fetch_credentials.py
        echo "from selenium.webdriver.support import expected_conditions as EC" >> fetch_credentials.py
        echo "" >> fetch_credentials.py
        echo "# Configurar Selenium" >> fetch_credentials.py
        echo "options = webdriver.ChromeOptions()" >> fetch_credentials.py
        echo "options.add_argument('--headless')" >> fetch_credentials.py
        echo "options.add_argument('--no-sandbox')" >> fetch_credentials.py
        echo "options.add_argument('--disable-dev-shm-usage')" >> fetch_credentials.py
        echo "driver = webdriver.Chrome(options=options)" >> fetch_credentials.py
        echo "" >> fetch_credentials.py
        echo "try:" >> fetch_credentials.py
        echo "    # Navegar a la URL que contiene las credenciales" >> fetch_credentials.py
        echo "    driver.get('https://d-8067060d87.awsapps.com/start/#/?tab=accounts')" >> fetch_credentials.py
        echo "" >> fetch_credentials.py
        echo "    # Hacer clic en el botón 'Claves de acceso'" >> fetch_credentials.py
        echo "    WebDriverWait(driver, 10).until(" >> fetch_credentials.py
        echo "        EC.element_to_be_clickable((By.XPATH, \"//span[contains(text(), 'Claves de acceso')]\")" >> fetch_credentials.py
        echo "    ).click()" >> fetch_credentials.py
        echo "" >> fetch_credentials.py
        echo "    # Esperar y obtener las credenciales desde los \`span\`" >> fetch_credentials.py
        echo "    access_key_id = WebDriverWait(driver, 10).until(" >> fetch_credentials.py
        echo "        EC.presence_of_element_located((By.XPATH, \"//span[contains(text(), 'aws_access_key_id=')]\")" >> fetch_credentials.py
        echo "    ).text.split('=')[1]" >> fetch_credentials.py
        echo "" >> fetch_credentials.py
        echo "    secret_access_key = driver.find_element(By.XPATH, \"//span[contains(text(), 'aws_secret_access_key=')]\").text.split('=')[1]" >> fetch_credentials.py
        echo "    session_token = driver.find_element(By.XPATH, \"//span[contains(text(), 'aws_session_token=')]\").text.split('=')[1]" >> fetch_credentials.py
        echo "" >> fetch_credentials.py
        echo "    # Guardar credenciales en un archivo JSON" >> fetch_credentials.py
        echo "    creds = {" >> fetch_credentials.py
        echo "        \"AWS_ACCESS_KEY_ID\": access_key_id," >> fetch_credentials.py
        echo "        \"AWS_SECRET_ACCESS_KEY\": secret_access_key," >> fetch_credentials.py
        echo "        \"AWS_SESSION_TOKEN\": session_token" >> fetch_credentials.py
        echo "    }" >> fetch_credentials.py
        echo "" >> fetch_credentials.py
        echo "    with open(\"creds.json\", \"w\") as f:" >> fetch_credentials.py
        echo "        json.dump(creds, f)" >> fetch_credentials.py
        echo "" >> fetch_credentials.py
        echo "finally:" >> fetch_credentials.py
        echo "    driver.quit()" >> fetch_credentials.py

    - name: Ejecutar script de Python
      run: python fetch_credentials.py

    - name: Leer y establecer variables de entorno desde el archivo JSON
      run: |
        export $(jq -r 'to_entries|map("\(.key)=\(.value|tostring)")|.[]' creds.json)
      shell: bash

    - name: Guardar credenciales como secretos en GitHub
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        echo $AWS_ACCESS_KEY_ID
        echo $AWS_SECRET_ACCESS_KEY
        echo $AWS_SESSION_TOKEN

        # Obtener clave pública de GitHub
        headers="Authorization: token $GITHUB_TOKEN"
        response=$(curl -s -H "$headers" https://api.github.com/repos/${{ github.repository }}/actions/secrets/public-key)
        public_key=$(echo $response | jq -r .key)
        key_id=$(echo $response | jq -r .key_id)

        # Función para encriptar secretos
        encrypt_secret() {
          secret=$1
          key=$2
          echo $(echo -n "$secret" | openssl rsautl -encrypt -pubin -inkey <(echo "$key" | base64 -d) | base64)
        }

        # Encriptar y guardar secretos
        encrypted_aws_access_key_id=$(encrypt_secret "$AWS_ACCESS_KEY_ID" "$public_key")
        encrypted_aws_secret_access_key=$(encrypt_secret "$AWS_SECRET_ACCESS_KEY" "$public_key")
        encrypted_aws_session_token=$(encrypt_secret "$AWS_SESSION_TOKEN" "$public_key")

        curl -s -X PUT -H "$headers" -H "Content-Type: application/json" -d "{\"encrypted_value\":\"$encrypted_aws_access_key_id\",\"key_id\":\"$key_id\"}" https://api.github.com/repos/${{ github.repository }}/actions/secrets/AWS_ACCESS_KEY_ID
        curl -s -X PUT -H "$headers" -H "Content-Type: application/json" -d "{\"encrypted_value\":\"$encrypted_aws_secret_access_key\",\"key_id\":\"$key_id\"}" https://api.github.com/repos/${{ github.repository }}/actions/secrets/AWS_SECRET_ACCESS_KEY
        curl -s -X PUT -H "$headers" -H "Content-Type: application/json" -d "{\"encrypted_value\":\"$encrypted_aws_session_token\",\"key_id\":\"$key_id\"}" https://api.github.com/repos/${{ github.repository }}/actions/secrets/AWS_SESSION_TOKEN

        