name: AWS Credentials Automation

on:
  schedule:
    - cron: '0 */6 * * *' # Ejecutar cada 6 horas
  workflow_dispatch: # Permitir ejecución manual

jobs:
  fetch-credentials:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Configurar Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.9'

    - name: Instalar dependencias
      run: |
        sudo apt-get update
        sudo apt-get install -y unzip wget curl python3-pip
        python3 -m pip install selenium requests cryptography

    - name: Obtener y Guardar Credenciales
      run: |
        echo "
        import os
        from selenium import webdriver
        from selenium.webdriver.common.by import By
        from selenium.webdriver.support.ui import WebDriverWait
        from selenium.webdriver.support import expected_conditions as EC
        import json
        import base64
        import requests
        from cryptography.hazmat.primitives.asymmetric import padding
        from cryptography.hazmat.primitives import serialization, hashes

        # Configurar Selenium
        options = webdriver.ChromeOptions()
        options.add_argument('--headless')
        options.add_argument('--no-sandbox')
        options.add_argument('--disable-dev-shm-usage')
        driver = webdriver.Chrome(options=options)

        try:
            # Navegar a la URL que contiene las credenciales
            driver.get('https://d-8067060d87.awsapps.com/start/#/?tab=accounts')

            # Hacer clic en el botón 'Claves de acceso'
            WebDriverWait(driver, 10).until(
                EC.element_to_be_clickable((By.XPATH, "//span[contains(text(), 'Claves de acceso')]"))
            ).click()

            # Esperar y obtener las credenciales desde los `span`
            access_key_id = WebDriverWait(driver, 10).until(
                EC.presence_of_element_located((By.XPATH, "//span[contains(text(), 'aws_access_key_id=')]"))
            ).text.split('=')[1]

            secret_access_key = driver.find_element(By.XPATH, "//span[contains(text(), 'aws_secret_access_key=')]").text.split('=')[1]
            session_token = driver.find_element(By.XPATH, "//span[contains(text(), 'aws_session_token=')]").text.split('=')[1]

            # Encriptar secretos
            def encrypt_secret(secret, public_key):
                public_key = public_key.encode('utf-8')
                public_key = serialization.load_pem_public_key(public_key)
                encrypted_secret = public_key.encrypt(
                    secret.encode('utf-8'),
                    padding.OAEP(
                        mgf=padding.MGF1(algorithm=hashes.SHA256()),
                        algorithm=hashes.SHA256(),
                        label=None
                    )
                )
                return base64.b64encode(encrypted_secret).decode('utf-8')

            # Obtener clave pública de GitHub
            headers = {'Authorization': f'token {os.environ["GITHUB_TOKEN"]}'}
            response = requests.get('https://api.github.com/repos/${{ github.repository }}/actions/secrets/public-key', headers=headers)
            public_key_info = response.json()
            public_key = public_key_info['key']
            key_id = public_key_info['key_id']

            # Guardar credenciales como secretos en GitHub
            secrets = {
                'AWS_ACCESS_KEY_ID': access_key_id,
                'AWS_SECRET_ACCESS_KEY': secret_access_key,
                'AWS_SESSION_TOKEN': session_token
            }

            for secret_name, secret_value in secrets.items():
                encrypted_value = encrypt_secret(secret_value, public_key)
                data = {
                    'encrypted_value': encrypted_value,
                    'key_id': key_id
                }
                response = requests.put(
                    f'https://api.github.com/repos/${{ github.repository }}/actions/secrets/{secret_name}',
                    headers=headers,
                    json=data
                )
                print(f'Secret {secret_name} guardado: {response.status_code}')

        finally:
            driver.quit()
                " > fetch_credentials.py
                python fetch_credentials.py
